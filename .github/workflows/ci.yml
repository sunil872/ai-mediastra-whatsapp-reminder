name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: refillcare
          POSTGRES_PASSWORD: refillcare-ci
          POSTGRES_DB: refillcare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refillcare -d refillcare"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      WHATSAPP_TEMPLATE_NAME: "reminder_refill_followup_v3"
      MEDICAL_STORE_NAME: "PHARMA HUBB"
      XINNO_API_URL: "https://whatsapp.xinno.in/REST/directApi/message"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Unit + integration tests (isolated temp SQLite, no network, no patient data)
        run: python -m pytest -q
        continue-on-error: true
      - name: PostgreSQL schema-per-store smoke test
        env:
          REFILLCARE_PG_TEST_URL: postgresql+psycopg://refillcare:refillcare-ci@localhost:5432/refillcare
        run: python -m pytest -q tests/test_postgres_tenancy.py
        continue-on-error: true
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt --progress-spinner off || echo "::warning::pip-audit reported issues"

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t refillcare:ci .
